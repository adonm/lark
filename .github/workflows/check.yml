name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: lark/go.mod
          cache-dependency-path: lark/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install host check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc shellcheck
      - name: Run offline checks (no Vulkan toolchain or GPU)
        # sherpa-onnx-go-linux supplies the CGO libraries and their RUNPATH.
        # Kokoro and Parakeet weights are absent; GPU tests run via --live on a Vulkan host.
        env:
          TTS_MODEL_DIR: ${{ runner.temp }}/no-kokoro-model-pack
          GOFLAGS: ''
        run: ./scripts/check.sh
