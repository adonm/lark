<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lark Control</title>
  <link rel="stylesheet" href="oat.min.css">
  <style>
    :root { --panel-max: 440px; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: var(--background); color: var(--foreground); }
    .shell { max-width: var(--panel-max); margin: 0 auto; padding: 1.1rem 1rem 2.5rem; display: flex; flex-direction: column; gap: 1.1rem; }
    .hero { display: flex; align-items: center; gap: 0.9rem; }
    .portrait { width: 64px; height: 64px; border-radius: 14px; image-rendering: pixelated; object-fit: cover; background: var(--muted); flex: 0 0 auto; border: 1px solid var(--border); }
    .portrait-placeholder { width: 64px; height: 64px; border-radius: 14px; background: var(--muted); display: grid; place-items: center; flex: 0 0 auto; }
    .hero-meta { min-width: 0; flex: 1; }
    .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
    .hero-meta h1 { margin: 0; font-size: 1.25rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hero-meta p { margin: 0.25rem 0 0; color: var(--muted-foreground); font-size: 0.88rem; }
    .state-pill { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.2rem 0.55rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; background: var(--muted); color: var(--foreground); border: 1px solid var(--border); flex: 0 0 auto; }
    .state-dot { width: 7px; height: 7px; border-radius: 50%; background: #6b7280; }
    .state-pill[data-state="idle"] .state-dot { background: #16a34a; }
    .state-pill[data-state="listening"] .state-dot { background: #2563eb; }
    .state-pill[data-state="thinking"] .state-dot { background: #d97706; }
    .state-pill[data-state="speaking"] .state-dot { background: #7c3aed; }
    .state-pill[data-state="sleeping"] .state-dot { background: #64748b; }
    .tabs-bar { display: flex; overflow-x: auto; gap: 0.25rem; border-bottom: 1px solid var(--border); }
    .tab-btn { position: relative; flex: 1 0 auto; min-height: 44px; border: 0; background: transparent; color: var(--muted-foreground); padding: 0.55rem 0.5rem; font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem; }
    .tab-btn[aria-selected="true"] { color: var(--foreground); }
    .tab-btn[aria-selected="true"]::after { content: ""; position: absolute; inset: auto 0 0; border-block-end: 3px solid var(--primary); }
    .tab-btn:focus-visible, .pill-btn:focus-visible, .voice-btn:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .panel-list { display: flex; flex-direction: column; gap: 0.9rem; }
    .section-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted-foreground); margin: 0.25rem 0 -0.35rem; }
    .card-box { display: flex; flex-direction: column; gap: 0.75rem; padding: 1rem; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
    .row-card { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.9rem 1rem; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
    .row-info { min-width: 0; flex: 1; }
    .row-title { font-weight: 600; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-sub { color: var(--muted-foreground); font-size: 0.8rem; margin-top: 0.15rem; }
    .inline-form { display: flex; gap: 0.5rem; }
    .inline-form input { flex: 1; min-width: 0; min-height: 40px; padding: 0.45rem 0.7rem; border: 1px solid var(--border); border-radius: 8px; background: var(--background); color: var(--foreground); font: inherit; font-size: 0.9rem; }
    .inline-form button, .btn-compact { min-height: 40px; padding: 0.45rem 0.85rem; border-radius: 8px; border: 1px solid var(--border); background: var(--primary); color: var(--primary-foreground); font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; flex: 0 0 auto; }
    .btn-ghost { background: var(--background); color: var(--foreground); }
    .pill-group { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .pill-btn { min-height: 36px; padding: 0.35rem 0.75rem; border-radius: 999px; border: 1px solid var(--border); background: var(--background); color: var(--foreground); font: inherit; font-size: 0.83rem; cursor: pointer; }
    .pill-btn[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
    .voice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
    .voice-btn { min-height: 44px; padding: 0.6rem 0.75rem; border-radius: 10px; border: 1px solid var(--border); background: var(--background); color: var(--foreground); font: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-align: left; display: flex; align-items: center; justify-content: space-between; }
    .voice-btn[aria-pressed="true"] { border-color: var(--primary); background: var(--muted); }
    .is-pending { opacity: 0.6; }
    .status-banner { padding: 0.65rem 0.9rem; border-radius: 10px; font-size: 0.85rem; background: var(--muted); color: var(--foreground); display: none; }
    .status-banner[data-visible="true"] { display: block; }
    .status-banner[data-tone="error"] { background: #fee2e2; color: #991b1b; }
    .status-banner[data-tone="ok"] { background: #dcfce7; color: #166534; }
    .range-row { display: flex; align-items: center; gap: 0.75rem; }
    .range-row input[type="range"] { flex: 1; min-height: 32px; }
    .story-bar { width: 100%; height: 8px; border-radius: 999px; accent-color: var(--primary); }
    .btn-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .hist-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.6rem; }
    .hist-item { padding: 0.85rem 1rem; border: 1px solid var(--border); border-radius: 12px; background: var(--card); display: flex; flex-direction: column; gap: 0.3rem; }
    .hist-meta { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-size: 0.78rem; color: var(--muted-foreground); }
    .hist-speaker { font-weight: 700; color: var(--foreground); }
    .hist-text { font-size: 0.92rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
    .empty { color: var(--muted-foreground); font-size: 0.9rem; text-align: center; padding: 1.5rem 0.5rem; margin: 0; }
    .visually-hidden { position: absolute !important; clip-path: inset(50%) !important; overflow: hidden !important; width: 1px !important; height: 1px !important; margin: -1px !important; padding: 0 !important; border: 0 !important; white-space: nowrap !important; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div id="portrait-wrap" class="portrait-placeholder" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
      </div>
      <div class="hero-meta">
        <div class="hero-top">
          <h1 id="comp-name">Lark Companion</h1>
          <span id="live-state" class="state-pill" data-state="offline"><span class="state-dot" aria-hidden="true"></span><span id="live-state-text">Offline</span></span>
        </div>
        <p id="comp-form">Connecting…</p>
      </div>
    </header>

    <div id="feedback" class="status-banner" role="status" aria-live="polite"></div>

    <nav class="tabs-bar" role="tablist" aria-label="Control panel sections">
      <button type="button" id="tab-status" class="tab-btn" role="tab" data-tab="status" aria-selected="true" tabindex="0">Status</button>
      <button type="button" id="tab-stories" class="tab-btn" role="tab" data-tab="stories" aria-selected="false" tabindex="-1">Stories</button>
      <button type="button" id="tab-history" class="tab-btn" role="tab" data-tab="history" aria-selected="false" tabindex="-1">History</button>
      <button type="button" id="tab-settings" class="tab-btn" role="tab" data-tab="settings" aria-selected="false" tabindex="-1">Settings</button>
    </nav>

    <main>
      <section id="panel-status" role="tabpanel" aria-labelledby="tab-status"><div id="body-status" class="panel-list"></div></section>
      <section id="panel-stories" role="tabpanel" aria-labelledby="tab-stories" hidden="until-found"><div id="body-stories" class="panel-list"></div></section>
      <section id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden="until-found"><div id="body-history" class="panel-list"></div></section>
      <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden="until-found"><div id="body-settings" class="panel-list"></div></section>
    </main>
  </div>

  <script src="webxdc.js"></script>
  <script src="oat.min.js" defer></script>
  <script src="codec.js"></script>
  <script src="app.js"></script>
</body>
</html>
