<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lark Story</title>
  <link rel="stylesheet" href="oat.min.css">
  <style>
    body { margin: 0; background: var(--background); color: var(--foreground); }
    .shell { max-width: 480px; margin: 0 auto; padding: 1.25rem 1rem 2.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .story-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.65rem; }
    .story-head h1 { margin: 0; font-size: 1.2rem; }
    .story-card { padding: 1.1rem; border: 1px solid var(--border); border-radius: 12px; background: var(--card); line-height: 1.55; white-space: pre-wrap; }
    .choices { display: flex; flex-direction: column; gap: 0.6rem; }
    .choices button { min-height: 48px; text-align: left; }
    .end-note { color: var(--muted-foreground); font-size: 0.9rem; text-align: center; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="story-head">
      <h1 id="story-title">Lark Story</h1>
      <button id="btn-restart" type="button" class="button outline">Restart</button>
    </header>
    <article id="passage-text" class="story-card" aria-live="polite">Loading story…</article>
    <nav id="choices" class="choices" aria-label="Story choices"></nav>
  </main>
  <script src="webxdc.js"></script>
  <script src="story.js"></script>
</body>
</html>
